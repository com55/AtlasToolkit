name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "www/**"
      - "packages/spine-atlas-toolkit/**"
      - "atlas_toolkit_app/__init__.py"
      - "atlas_toolkit_app/host/**"
      - "APP_VERSION"
      - "LICENSE"
      - "NOTICE"
      - "THIRD_PARTY_NOTICES.md"
      - "scripts/build_web.py"
      - "scripts/web_version.py"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Upload and deploy are separate jobs (GitHub's starter layout): deploy-pages
  # in the same job as the upload can miss the artifact it just uploaded.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JavaScript dependencies
        run: npm ci

      # Pyodide runtime, engine wheels, bundled page, generated sw.js and the
      # version stamp; fails if the shipped import graph is broken.
      - name: Build web app
        run: uv run python scripts/build_web.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
