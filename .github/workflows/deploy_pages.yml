name: Deploy GitHub Pages

on:
  push:
    branches:
      - js-project
    paths:
      - "www/**"
      - ".github/workflows/deploy_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull vendor dependencies
        env:
          VENDOR_SOURCE_REPO: ${{ secrets.VENDOR_SOURCE_REPO }}
          VENDOR_SOURCE_TAG: ${{ secrets.VENDOR_SOURCE_TAG }}
        run: |
          git clone --quiet --depth 1 --branch "$VENDOR_SOURCE_TAG" "$VENDOR_SOURCE_REPO" "$RUNNER_TEMP/vendor-src"
          mkdir -p www/js/vendor/spine-skeleton-binary
          cp "$RUNNER_TEMP"/vendor-src/src/*.js www/js/vendor/spine-skeleton-binary/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
