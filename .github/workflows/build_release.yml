name: Build Windows (js-project)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      test_version:
        description: 'Optional test version (e.g. 1.2.3) — skips release, uploads artifact'
        required: false
        type: string

permissions:
  contents: write

env:
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Get version for build
        id: build_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.test_version }}" -ne "") {
            $version = "${{ inputs.test_version }}"
          } elseif ("${{ github.ref }}" -match "refs/tags/v(.+)") {
            $version = $matches[1]
          } else {
            $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
            $version = $conf.version
          }
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $version"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.IS_RELEASE == 'true' && github.ref_name || '' }}
          releaseName: ${{ env.IS_RELEASE == 'true' && format('AtlasToolkit {0}', github.ref_name) || '' }}
          releaseDraft: ${{ env.IS_RELEASE == 'true' }}
          prerelease: false
          updaterJsonPreferNsis: true

      - name: Check signing secrets
        id: check_secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.CERT_BASE64 }}" ] && [ -n "${{ secrets.CERT_PASSWORD }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Sign installers
        if: steps.check_secrets.outputs.available == 'true'
        shell: pwsh
        env:
          CERT_DATA: ${{ secrets.CERT_BASE64 }}
          CERT_PASS: ${{ secrets.CERT_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "cert.pfx"

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\" -Filter signtool.exe -Recurse |
                      Where-Object { $_.FullName -match "x64" } |
                      Sort-Object -Property LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty FullName

          $targets = @(
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
            Get-ChildItem -Path "src-tauri/target/release/bundle/msi"  -Filter "*.msi" -ErrorAction SilentlyContinue
          ) | Select-Object -ExpandProperty FullName

          try {
            $cleanBase64 = $env:CERT_DATA -replace '\s', ''
            $certBytes = [System.Convert]::FromBase64String($cleanBase64)
            [System.IO.File]::WriteAllBytes($certPath, $certBytes)

            certutil -p $env:CERT_PASS -dump $certPath | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Incorrect password or corrupted PFX file." }

            foreach ($target in $targets) {
              Write-Host "Signing: $target"
              & $signtool sign /f $certPath /p "$env:CERT_PASS" /tr http://timestamp.digicert.com /td sha256 /fd sha256 /v $target
              if ($LASTEXITCODE -ne 0) { throw "SignTool failed on: $target" }
            }
          }
          finally {
            if (Test-Path $certPath) { Remove-Item $certPath -Force }
          }

      - name: Upload artifact (test build)
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AtlasToolkit-Windows-${{ steps.build_version.outputs.version }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Re-upload signed installers to release
        if: steps.check_secrets.outputs.available == 'true' && env.IS_RELEASE == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/msi/*.msi \
            --clobber
