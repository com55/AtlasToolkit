name: Build and Release

on:
  # 1. AUTO RELEASE TRIGGER (from auto_tag.yml)
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  # 2. MANUAL TRIGGER (with tag push)
  push:
    tags:
      - "v*"
  # 3. MANUAL TRIGGER (workflow_dispatch)
  workflow_dispatch:
    inputs:
      test_version:
        description: "Optional test version (digits only, e.g. 1.2.3) to publish as tag v<version>"
        required: false
        type: string

permissions:
  contents: write

env:
  MANUAL_TEST_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_version || '' }}
  # Determine if this is a release (from workflow_call OR tag push)
  IS_RELEASE: ${{ inputs.tag_name != '' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_version != '') }}
  TAG_NAME: ${{ inputs.tag_name != '' && inputs.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_version != '' && format('v{0}', github.event.inputs.test_version)) || '' }}
  # Force console for manual builds (debugging), disable for releases
  CONSOLE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'attach' || 'disable' }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install Dependencies
        run: uv export --no-hashes -o requirements.txt && pip install -r requirements.txt

      - name: Get version for build
        id: build_version
        shell: powershell
        run: |
          if ("${{ env.MANUAL_TEST_VERSION }}" -ne "" -and "${{ env.MANUAL_TEST_VERSION }}" -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid test_version. Expected format: X.Y.Z (digits only)."
          }

          if ("${{ github.ref }}" -match "refs/tags/v(.+)") {
            $version = $matches[1]
          } elseif ("${{ inputs.tag_name }}" -ne "") {
            $version = "${{ inputs.tag_name }}".TrimStart("v")
          } elseif ("${{ env.MANUAL_TEST_VERSION }}" -ne "") {
            $version = "${{ env.MANUAL_TEST_VERSION }}"
          } else {
            $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches.Groups[1].Value
          }
          if (-not $version) { $version = "0.0.0" }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          $version | Out-File -FilePath VERSION -Encoding utf8 -NoNewline
          echo "Building version: $version"

      - name: Build with Nuitka 🏗️
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: main.py
          mode: onefile
          windows-console-mode: ${{ env.CONSOLE_MODE }}
          windows-icon-from-ico: ui/icon.ico
          include-data-dir: ui=ui
          include-data-files: |
            VERSION=VERSION
            self_update_helper.py=self_update_helper.py
          include-package-data: webview
          nofollow-import-to: |
            PyQt5
            PyQt6
            PySide2
            PySide6
            tkinter
            gi
          output-dir: dist
          output-file: AtlasToolkit.exe
          onefile-tempdir-spec: "{TEMP}/AtlasToolkit"

      - name: Check signing secrets
        id: check_secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.CERT_BASE64 }}" ] && [ -n "${{ secrets.CERT_PASSWORD }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Sign Executable
        if: steps.check_secrets.outputs.available == 'true'
        shell: pwsh
        env:
          CERT_DATA: ${{ secrets.CERT_BASE64 }}
          CERT_PASS: ${{ secrets.CERT_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "cert.pfx"
          $exePath = "dist/AtlasToolkit.exe"

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\" -Filter signtool.exe -Recurse | 
                      Where-Object { $_.FullName -match "x64" } | 
                      Sort-Object -Property LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty FullName

          try {
              $cleanBase64 = $env:CERT_DATA -replace '\s',''
              $certBytes = [System.Convert]::FromBase64String($cleanBase64)
              [System.IO.File]::WriteAllBytes($certPath, $certBytes)

              Write-Host "Verifying PFX and Password..."
              certutil -p $env:CERT_PASS -dump $certPath | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Incorrect password or corrupted PFX file." }

              Write-Host "Signing executable..."
              & $signtool sign /f $certPath /p "$env:CERT_PASS" /tr http://timestamp.digicert.com /td sha256 /fd sha256 /v $exePath
              
              if ($LASTEXITCODE -ne 0) { throw "SignTool failed with code: $LASTEXITCODE" }
          }
          catch {
              Write-Host "ERROR: $($_.Exception.Message)" -ForegroundColor Red
              exit 1
          }
          finally {
              if (Test-Path $certPath) { Remove-Item $certPath -Force }
          }

      - name: Prepare Assets for Upload 📦
        shell: powershell
        id: prepare_assets
        run: |
          $exePath = "dist/AtlasToolkit.exe"
          # Release (from workflow_call or tag push)
          if ("${{ env.IS_RELEASE }}" -eq 'true') {
            Compress-Archive -Path $exePath -DestinationPath "AtlasToolkit-Windows-x64.zip"
            echo "ARTIFACT_PATH=AtlasToolkit-Windows-x64.zip" >> $env:GITHUB_OUTPUT
          }
          # Manual (workflow_dispatch)
          else {
            echo "ARTIFACT_NAME=AtlasToolkit-Windows-x64" >> $env:GITHUB_OUTPUT
            echo "ARTIFACT_PATH=$exePath" >> $env:GITHUB_OUTPUT
          }

      - name: Upload Artifact (Testing) 💾
        uses: actions/upload-artifact@v4
        if: ${{ steps.prepare_assets.outputs.ARTIFACT_NAME != '' }}
        with:
          name: ${{ steps.prepare_assets.outputs.ARTIFACT_NAME }}
          path: ${{ steps.prepare_assets.outputs.ARTIFACT_PATH }}

      - name: Upload Release Asset 📤
        if: ${{ env.IS_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          files: AtlasToolkit-Windows-x64.zip
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
