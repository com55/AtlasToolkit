name: Release app

on:
  push:
    branches:
      - main
    paths:
      - "APP_VERSION"

permissions:
  contents: write

jobs:
  tests-app:
    uses: ./.github/workflows/tests_app.yml

  # The app ships the library from this repo, so its tests gate an app
  # release too.
  tests-lib:
    uses: ./.github/workflows/tests_lib.yml

  create-tag:
    needs: [tests-app, tests-lib]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The About dialog shows the library version, so an app release must not
      # ship library code that differs from the released library under the same
      # version: bump __version__ (publish_lib.yml) first.
      - name: Check the library version was bumped 🔍
        run: |
          LIB=packages/spine-atlas-toolkit/spine_atlas_toolkit
          VERSION=$(grep -oP '(?<=^__version__ = ")[^"]+' "$LIB/__init__.py")
          TAG="lib-v$VERSION"
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Library $VERSION is not released yet ($TAG missing)." >&2
            exit 1
          fi
          # Compare trees, so a move of the package with no changes passes
          # (lib-v1.0.0 has it at spine_atlas_toolkit/).
          RELEASED=$(git rev-parse -q --verify "$TAG:$LIB" || git rev-parse "$TAG:spine_atlas_toolkit")
          if [ "$RELEASED" != "$(git rev-parse "HEAD:$LIB")" ]; then
            echo "The library changed since $TAG: bump __version__ and release it first." >&2
            exit 1
          fi
          echo "Library code matches $TAG."

      - name: Get app version from APP_VERSION 📋
        id: get_version
        run: |
          VERSION=$(tr -d '[:space:]' < APP_VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Found version: $VERSION"

      - name: Check if Tag Exists 🔍
        id: check
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TAG_NAME="v$VERSION"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "⏭️ Tag $TAG_NAME already exists, skipping..."
            echo "should_create=false" >> $GITHUB_OUTPUT
          else
            echo "✨ Tag $TAG_NAME does not exist, will create..."
            echo "should_create=true" >> $GITHUB_OUTPUT
          fi

      - name: Create and Push Tag 🏷️
        if: steps.check.outputs.should_create == 'true'
        id: create_tag
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          TAG_NAME="v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"
          echo "🚀 Created and pushed tag: $TAG_NAME"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

    outputs:
      should_build: ${{ steps.check.outputs.should_create }}
      tag_name: ${{ steps.create_tag.outputs.tag_name }}

  # Trigger build and release after tag is created
  build-release:
    needs: create-tag
    if: needs.create-tag.outputs.should_build == 'true'
    uses: ./.github/workflows/build_release.yml
    # A called workflow sees no repository secrets unless they are passed on:
    # without this the vendor pull fails and code signing is skipped.
    secrets: inherit
    with:
      tag_name: ${{ needs.create-tag.outputs.tag_name }}
