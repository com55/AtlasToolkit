name: Tests (app)

# The app's Python tests (tests/python) and the JavaScript tests, against the
# library in this repo. Runs on every push and pull request (the app depends
# on the library, so a library change runs these too), and is called by
# auto_tag.yml before it tags an app release.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # node_modules gives test_build_web its real esbuild.
      - name: Install dependencies
        run: |
          uv sync
          npm ci

      - name: Python tests
        run: uv run pytest -q tests/python

      - name: JavaScript tests
        run: npm test
