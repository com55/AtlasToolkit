name: Tests

# Python and JavaScript unit tests. Runs on pushes and pull requests, and is
# called by the release workflows (auto_tag.yml, publish_lib.yml) before they
# tag anything, so a red suite never becomes a release.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # node_modules gives test_build_web its real esbuild.
      - name: Install dependencies
        run: |
          uv sync --group app
          npm ci

      - name: Python tests
        run: uv run pytest -q

      - name: JavaScript tests
        run: npm test
