name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Set version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json
          Write-Host "Version set to: $version"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AtlasToolkit ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true

      - name: Check signing secrets
        id: check_secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.CERT_BASE64 }}" ] && [ -n "${{ secrets.CERT_PASSWORD }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Sign installers
        if: steps.check_secrets.outputs.available == 'true'
        shell: pwsh
        env:
          CERT_DATA: ${{ secrets.CERT_BASE64 }}
          CERT_PASS: ${{ secrets.CERT_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "cert.pfx"

          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\" -Filter signtool.exe -Recurse |
                      Where-Object { $_.FullName -match "x64" } |
                      Sort-Object -Property LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty FullName

          $targets = @(
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
            Get-ChildItem -Path "src-tauri/target/release/bundle/msi"  -Filter "*.msi" -ErrorAction SilentlyContinue
          ) | Select-Object -ExpandProperty FullName

          try {
            $cleanBase64 = $env:CERT_DATA -replace '\s', ''
            $certBytes = [System.Convert]::FromBase64String($cleanBase64)
            [System.IO.File]::WriteAllBytes($certPath, $certBytes)

            certutil -p $env:CERT_PASS -dump $certPath | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Incorrect password or corrupted PFX file." }

            foreach ($target in $targets) {
              Write-Host "Signing: $target"
              & $signtool sign /f $certPath /p "$env:CERT_PASS" /tr http://timestamp.digicert.com /td sha256 /fd sha256 /v $target
              if ($LASTEXITCODE -ne 0) { throw "SignTool failed on: $target" }
            }
          }
          finally {
            if (Test-Path $certPath) { Remove-Item $certPath -Force }
          }

      - name: Re-upload signed installers
        if: steps.check_secrets.outputs.available == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            src-tauri/target/release/bundle/nsis/*.exe \
            src-tauri/target/release/bundle/msi/*.msi \
            --clobber
