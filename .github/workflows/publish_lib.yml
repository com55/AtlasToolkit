name: Release library

# Publishes spine-atlas-toolkit to PyPI when its version changes on main.
# The library version is __version__ in
# packages/spine-atlas-toolkit/spine_atlas_toolkit/__init__.py; the
# apps have their own version (APP_VERSION, released by auto_tag.yml).
# PyPI trusted publishing: the publisher on pypi.org names this file
# (publish_lib.yml) and the "pypi" environment.
on:
  push:
    branches:
      - main
    paths:
      - "packages/spine-atlas-toolkit/spine_atlas_toolkit/__init__.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests_lib.yml

  tag:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag lib-v<version> unless it exists
        id: check
        run: |
          VERSION=$(grep -oP '(?<=^__version__ = ")[^"]+' packages/spine-atlas-toolkit/spine_atlas_toolkit/__init__.py)
          TAG="lib-v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, nothing to publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "spine-atlas-toolkit $VERSION"
          git push origin "$TAG"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    if: needs.tag.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      # --no-sources: build as PyPI users will, without the repo's git source
      # for skel-mesh-parser.
      - name: Build sdist and wheel
        run: uv build --package spine-atlas-toolkit --no-sources --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spine-atlas-toolkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
