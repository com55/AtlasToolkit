[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spine-atlas-toolkit"
version = "1.0.0"
description = "Spine Atlas Toolkit - Extract, modify, and repack atlas sprites."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pillow>=10.0,<13",
    "skel-mesh-parser @ git+https://github.com/com55/skel-mesh-parser.git@py-v0.3.0",
]

[project.urls]
Homepage = "https://github.com/com55/AtlasToolkit"
Source = "https://github.com/com55/AtlasToolkit"
Issues = "https://github.com/com55/AtlasToolkit/issues"

[project.optional-dependencies]
# Desktop shell only (spine_atlas_toolkit.app / spine_atlas_toolkit.update): the core
# engine imports none of these, so a library or Pyodide install omits them.
app = [
    "pywebview==6.1",
    "requests==2.32.5",
]

[tool.hatch.build.targets.wheel]
packages = ["spine_atlas_toolkit"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
