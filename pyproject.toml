[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "AtlasToolkit"
version = "0.3.5"
description = "Spine Atlas Toolkit - Extract, modify, and repack atlas sprites."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pillow>=10.0,<13",
    "skel-mesh-parser @ git+https://github.com/com55/skel-mesh-parser.git@python",
]

[project.optional-dependencies]
# Desktop shell only (atlas_toolkit.app / atlas_toolkit.update): the core
# engine imports none of these, so a library or Pyodide install omits them.
app = [
    "pywebview==6.1",
    "requests==2.32.5",
]

[tool.hatch.build.targets.wheel]
packages = ["atlas_toolkit"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
