[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "AtlasToolkit"
version = "0.3.3"
description = "Spine Atlas Toolkit - Extract, modify, and repack atlas sprites."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow==12.1.1",
    "pywebview==6.1",
    "requests==2.32.5",
]

[tool.hatch.build.targets.wheel]
packages = ["atlas_toolkit"]
