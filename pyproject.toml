# AtlasToolkit apps (web and desktop): never published, so no build system.
# The library they run on is the workspace member packages/spine-atlas-toolkit
# (on PyPI as spine-atlas-toolkit), with its own version and changelog. The
# app version is APP_VERSION.
[project]
name = "atlas-toolkit-app"
# Placeholder: uv requires one. The real app version is APP_VERSION.
version = "0"
requires-python = ">=3.11"
dependencies = [
    "spine-atlas-toolkit",
    "pywebview==6.1",
    "requests==2.32.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/spine-atlas-toolkit"]

[tool.uv.sources]
spine-atlas-toolkit = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/python", "packages/spine-atlas-toolkit/tests"]
# atlas_toolkit_app is not installed (package = false): import it from here.
pythonpath = ["."]
