<!doctype html>

<html lang="en">

  <head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Atlas Extracter GUI</title>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/overlays.css" />

  </head>

  <body>

    <header id="app-bar">

      <div class="app-bar-left">

        <button class="btn-open" onclick="openFile()">

          <svg

            class="btn-icon"

            xmlns="http://www.w3.org/2000/svg"

            viewBox="0 -960 960 960"

          >

            <path

              d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h240l80 80h320q33 0 56.5 23.5T880-640H447l-80-80H160v480l96-320h684L837-217q-8 26-29.5 41.5T760-160H160Zm84-80h516l72-240H316l-72 240Zm0 0 72-240-72 240Zm-84-400v-80 80Z"

            />

          </svg>

          Open

        </button>

        <div class="app-bar-divider"></div>

        <div id="mode-toggle" class="mode-toggle">

          <button type="button" id="mode-extract" class="mode-toggle-btn mode-view active">
            View Mode
          </button>
          <button type="button" id="mode-modify" class="mode-toggle-btn mode-edit" disabled>
            Edit Mode
          </button>

        </div>

      </div>

      <div class="app-bar-divider app-bar-panel-divider"></div>

      <div class="app-bar-right">

        <div id="extract-controls">

          <button

            class="action-btn"

            id="btn-extract-sel"

            onclick="extractSelected()"

            disabled

          >

            Extract Selected

          </button>

          <button

            class="action-btn"

            id="btn-extract-all"

            onclick="extractAll()"

            disabled

          >

            Extract All
          </button>
          <button
            class="action-btn btn-save-merged"
            id="btn-save-merged"
            onclick="saveMergedImage()"
            disabled
            title="Save the preview image as PNG"
          >
            <svg
              class="btn-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 -960 960 960"
            >
              <path
                d="M840-680v480q0 33-23.5 56.5T760-120H200q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h480l160 160Zm-80 34L646-760H200v560h560v-446ZM565-275q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35ZM240-560h360v-160H240v160Zm-40-86v446-560 114Z"
              />
            </svg>
            Save Image
          </button>
        </div>

        <div id="modify-controls" class="hidden">

          <button

            class="action-btn"

            id="btn-modify-sel"

            onclick="modifySelected()"

          >

            Modify Selected

          </button>

          <button
            class="action-btn btn-reset"
            id="btn-reset-mod"
            onclick="resetModify()"
            disabled
            title="Discard all modifications and restore the original atlas"
          >
            <svg
              class="btn-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 -960 960 960"
            >
              <path
                d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"
              />
            </svg>
            Reset
          </button>

          <div id="modify-page-switcher" class="hidden">

            <button

              class="page-nav-btn"

              id="page-prev"

              onclick="modifyPagePrev()"

              title="Previous page"

            >

              ‹

            </button>

            <span id="page-indicator">Page 1 / 1</span>

            <button

              class="page-nav-btn"

              id="page-next"

              onclick="modifyPageNext()"

              title="Next page"

            >

              ›

            </button>

          </div>

        </div>

        <button
          class="action-btn btn-save hidden"
          id="btn-save-mod"
          onclick="saveModified()"
          disabled
        >
          <svg
            class="btn-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 -960 960 960"
          >
            <path
              d="M840-680v480q0 33-23.5 56.5T760-120H200q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h480l160 160Zm-80 34L646-760H200v560h560v-446ZM565-275q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35ZM240-560h360v-160H240v160Zm-40-86v446-560 114Z"
            />
          </svg>
          Save As...
        </button>

      </div>

    </header>



    <div id="main-content">

      <div id="left-panel">

        <div id="sidebar-head">

          Regions (<span id="count">0</span>)

        </div>

        <div id="region-list-container">

          <ul id="region-list"></ul>

        </div>

      </div>



      <div id="right-panel">

        <div id="repack-options" class="hidden">

          <label

            class="toggle-label"

            title="Repack will extract all regions, remove unused space, deduplicate identical sprites, and repack everything into a smaller atlas."

          >

            <input type="checkbox" id="chk-repack" />

            <span class="toggle-switch"></span>

            <span>Repack</span>

            <svg

              class="info-icon"

              xmlns="http://www.w3.org/2000/svg"

              viewBox="0 -960 960 960"

            >

              <path

                d="M440-280h80v-240h-80v240Zm40-320q17 0 28.5-11.5T520-640q0-17-11.5-28.5T480-680q-17 0-28.5 11.5T440-640q0 17 11.5 28.5T480-600Zm0 520q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"

              />

            </svg>

          </label>

        </div>

        <div id="status-bar">

          <span id="status-text">Ready</span>

        </div>

        <div id="preview-container">

          <img id="preview-img" src="" alt="Preview" />

          <canvas id="region-overlay"></canvas>

        </div>

        <div id="toast-container"></div>

      </div>

    </div>



    <!-- Custom Confirm Modal -->

    <div id="modal-overlay" class="hidden">

      <div id="modal-box">

        <h3 id="modal-title">Confirm</h3>

        <p id="modal-message">Are you sure?</p>

        <div class="modal-buttons">

          <button id="btn-modal-cancel" class="btn-secondary">Cancel</button>

          <button id="btn-modal-confirm" class="btn-primary">Confirm</button>

        </div>

      </div>

    </div>



    <!-- Drop Overlay -->

    <div id="drop-overlay" class="hidden">

      <div class="drop-message">

        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">

          <path

            d="M440-320v-326L336-542l-56-58 200-200 200 200-56 58-104-104v326h-80ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"

          />

        </svg>

        <span id="drop-message-text">Drop .atlas file here to load</span>

      </div>

    </div>



    <!-- Context Menu -->

    <div id="context-menu" class="hidden">

      <div class="context-menu-item" onclick="copyPreviewImage()">

        <svg

          class="btn-icon"

          xmlns="http://www.w3.org/2000/svg"

          viewBox="0 -960 960 960"

        >

          <path

            d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z"

          />

        </svg>

        Copy Image

      </div>

    </div>



    <script src="js/state.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/preview.js"></script>
    <script src="js/regions.js"></script>
    <script src="js/modify.js"></script>
    <script src="js/mode.js"></script>
    <script src="js/atlas-load.js"></script>
    <script src="js/extract.js"></script>
    <script src="js/keyboard.js"></script>
    <script src="js/drag-drop.js"></script>
    <script src="js/context-menu.js"></script>
    <script src="js/updates.js"></script>
    <script src="js/app.js"></script>

  </body>

</html>
