<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0e639c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Atlas Toolkit</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
    <script>
      // Desktop layout lock (unify-js-engine Phase 6): must run synchronously,
      // before CSS is applied for first paint, so the portrait/stacked-mobile
      // media queries in style.css never flash on for the pywebview shell.
      // `window.pywebview` itself isn't reliably present this early (injected
      // asynchronously, races DOMContentLoaded -- see script.js's
      // _waitForPywebviewReady()), but launch.py always loads this file via a
      // literal file:// URI, which IS available synchronously from the very
      // first parsed byte and is never true for the hosted PWA/browser case.
      if (location.protocol === 'file:') {
        document.documentElement.classList.add('pywebview');
      }
    </script>
  </head>
  <body class="mode-extract">
    <!-- Full-width application bar -->
    <header id="app-bar">
      <div class="app-bar-left">
        <button class="btn-open" onclick="openFile()" title="Tip: in the file picker, you can select the .atlas file together with its .png image(s) at once.">
          <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
            <path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h240l80 80h320q33 0 56.5 23.5T880-640H447l-80-80H160v480l96-320h684L837-217q-8 26-29.5 41.5T760-160H160Zm84-80h516l72-240H316l-72 240Zm0 0 72-240-72 240Zm-84-400v-80 80Z"/>
          </svg>
          <span class="btn-label">Open</span>
        </button>
        <div class="app-bar-divider"></div>
        <div id="mode-toggle" class="mode-toggle" role="group" aria-label="View / Edit mode">
          <button type="button" id="mode-extract" class="mode-toggle-btn mode-view active">View Mode</button>
          <button type="button" id="mode-modify" class="mode-toggle-btn mode-edit" disabled>Edit Mode</button>
        </div>
      </div>

      <div class="app-bar-divider app-bar-panel-divider"></div>

      <div class="app-bar-right">
        <!-- View / extract mode controls -->
        <div id="extract-controls">
          <button class="action-btn" id="btn-extract-sel" onclick="extractSelected()" disabled>
            Extract Selected
          </button>
          <button class="action-btn" id="btn-extract-all" onclick="extractAll()" disabled>
            Extract All
          </button>
          <button class="action-btn btn-save-merged" id="btn-save-merged" onclick="saveMergedImage()" disabled title="Save the preview image as PNG">
            <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
              <path d="M840-680v480q0 33-23.5 56.5T760-120H200q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h480l160 160Zm-80 34L646-760H200v560h560v-446ZM565-275q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35ZM240-560h360v-160H240v160Zm-40-86v446-560 114Z"/>
            </svg>
            Save Image
          </button>
        </div>

        <!-- Edit / modify mode controls -->
        <div id="modify-controls" class="hidden">
          <button class="action-btn" id="btn-modify-sel" onclick="ReplaceSelected()">
            Modify Selected
          </button>
          <button class="action-btn btn-reset" id="btn-reset-mod" onclick="resetModify()" disabled title="Discard all modifications and restore the original atlas">
            <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
              <path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/>
            </svg>
            Reset
          </button>
          <div id="modify-page-switcher" class="hidden">
            <button class="page-nav-btn" id="page-prev" type="button" title="Previous page" aria-label="Previous page">‹</button>
            <span id="page-indicator">Page 1 / 1</span>
            <button class="page-nav-btn" id="page-next" type="button" title="Next page" aria-label="Next page">›</button>
          </div>
        </div>

        <div class="save-split hidden" id="save-split">
          <button class="action-btn btn-save" id="btn-save-mod" onclick="saveModified()" disabled>
            <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
              <path d="M840-680v480q0 33-23.5 56.5T760-120H200q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h480l160 160Zm-80 34L646-760H200v560h560v-446ZM565-275q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35ZM240-560h360v-160H240v160Zm-40-86v446-560 114Z"/>
            </svg>
            Save As...
          </button>
          <button class="action-btn btn-save" id="btn-save-menu" type="button" aria-haspopup="true" aria-expanded="false" title="Save options">
            <span class="save-caret"></span>
          </button>
          <div class="save-menu" id="save-menu">
            <label class="toggle-label" id="skel-row">
              <input type="checkbox" id="chk-copy-skel" checked />
              <span class="toggle-switch"></span>
              <span>Copy .skel</span>
            </label>
            <p class="save-menu-hint">Also copy .skel to output</p>
          </div>
        </div>
      </div>
    </header>

    <div id="main-content">
      <div id="left-panel">
        <div id="advance-toolbar" class="hidden">
          <button type="button" id="btn-rename-region" title="Select a single region to rename" disabled>
            <svg class="btn-icon" viewBox="0 -960 960 960"><path d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"/></svg>
            <span class="btn-label">Rename</span>
          </button>
          <button type="button" id="btn-add-region" title="Add new region">
            <svg class="btn-icon" viewBox="0 -960 960 960"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg>
            <span class="btn-label">Add</span>
          </button>
          <button type="button" id="btn-remove-region" title="Remove select regions">
            <svg class="btn-icon" viewBox="0 -960 960 960"><path d="M200-440v-80h560v80H200Z"/></svg>
            <span class="btn-label">Remove</span>
          </button>
        </div>
        <div id="sidebar-head">Regions (<span id="count">0</span>)</div>
        <div id="region-list-container">
          <ul id="region-list"></ul>
        </div>
      </div>

      <div id="panel-splitter" role="separator" aria-orientation="vertical" aria-label="Resize panels"></div>

      <div id="right-panel">
        <div id="options-row-wrap">
          <ul id="options-row">
          <li id="options-group-mesh">
            <div class="only-view-mode">
              <label class="toggle-label" id="mesh-mask-toggle-row" data-help="Mesh Cropping will crop each region using its real mesh silhouette from the .skel file instead of a plain rectangle, preventing bleed from other regions packed nearby.">
                <input type="checkbox" id="chk-mesh-mask" />
                <span class="toggle-switch"></span>
                <span>Mesh Cropping</span>
              </label>
            </div>
            <div class="only-edit-mode">
              <label class="toggle-label" id="mesh-aware-repack-toggle-row" data-help="Mask each region's pixels to its mesh silhouette before packing, so the repacked atlas matches what extraction already shows.">
                <input type="checkbox" id="chk-mesh-aware-repack" />
                <span class="toggle-switch"></span>
                <span>Mesh-Aware</span>
              </label>
            </div>
            <button id="btn-pick-skel" class="skel-picker-btn hidden" type="button"></button>
          </li>
          <li id="options-group-pack" class="only-edit-mode">
            <label class="toggle-label" id="nest-regions-toggle-row" data-help="Squeeze smaller regions into gaps in the layout instead of always starting a new row (slower to repack).">
              <input type="checkbox" id="chk-nest-regions" />
              <span class="toggle-switch"></span>
              <span>Smart Packing</span>
            </label>
            <button id="btn-nest-settings" type="button" disabled aria-label="Smart Packing gap settings" aria-expanded="false" aria-haspopup="dialog" aria-controls="nest-gap-panel">
              <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20" aria-hidden="true"><path fill="currentColor" d="m403-96-22-114q-23-9-44.5-21T296-259l-110 37-77-133 87-76q-2-12-3-24t-1-25q0-13 1-25t3-24l-87-76 77-133 110 37q19-16 40.5-28t44.5-21l22-114h154l22 114q23 9 44.5 21t40.5 28l110-37 77 133-87 76q2 12 3 24t1 25q0 13-1 25t-3 24l87 76-77 133-110-37q-19 16-40.5 28T579-210L557-96H403Zm59-72h36l19-99q38-7 71-26t57-48l96 32 18-30-76-67q6-17 9.5-35.5T696-480q0-20-3.5-38.5T683-554l76-67-18-30-96 32q-24-29-57-48t-71-26l-19-99h-36l-19 99q-38 7-71 26t-57 48l-96-32-18 30 76 67q-6 17-9.5-35.5T264-480q0 20 3.5 38.5T277-406l-76 67 18 30 96-32q24 29 57 48t71 26l19 99Zm18-168q60 0 102-42t42-102q0-60-42-102t-102-42q-60 0-102 42t-42 102q0 60 42 102t102 42Zm0-144Z"/></svg>
            </button>
          </li>
          <li id="options-group-advance" class="only-edit-mode">
            <label class="toggle-label" id="advance-mode-row" data-help="Advance Mode adds Rename / Add / Remove controls for editing regions directly.">
              <input type="checkbox" id="chk-advance-mode" />
              <span class="toggle-switch"></span>
              <span>Advance Mode</span>
            </label>
          </li>
        </ul>
          <button type="button" id="btn-options-collapse" class="hidden" aria-expanded="false" aria-label="Show more options">
            <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20" aria-hidden="true"><path fill="currentColor" d="M480-344 240-584l56-56 184 184 184-184 56 56-240 240Z"/></svg>
          </button>
        </div>
        <div id="status-bar">
          <span id="status-text">Ready</span>
        </div>
        <div id="preview-container">
          <img id="preview-img" src="" alt="Preview" />
          <canvas id="region-overlay"></canvas>
        </div>
        <div id="toast-container"></div>
      </div>
    </div>

    <!-- Custom Confirm Modal -->
    <div id="modal-overlay" class="hidden">
      <div id="modal-box">
        <h3 id="modal-title">Confirm</h3>
        <p id="modal-message">Are you sure?</p>
        <div class="modal-buttons">
          <button id="btn-modal-cancel" class="btn-secondary">Cancel</button>
          <button id="btn-modal-confirm" class="btn-primary">Confirm</button>
        </div>
      </div>
    </div>

    <!-- Rename Region Modal -->
    <div id="rename-modal" class="hidden">
      <div id="rename-modal-box">
        <h3>Rename region</h3>
        <input type="text" id="rename-name-input" />
        <p id="rename-name-error" class="field-error hidden"></p>
        <div class="modal-buttons">
          <button type="button" class="btn-secondary" id="rename-cancel-btn">Cancel</button>
          <button type="button" class="btn-primary" id="rename-confirm-btn" disabled>Save</button>
        </div>
      </div>
    </div>

    <div id="add-region-modal" class="hidden">
      <div id="add-region-modal-box">
        <h3>Add region</h3>
        <div id="add-drop-area">
          <input type="file" id="add-file-input" accept="image/png" hidden />
          <img id="add-image-preview" class="hidden" />
          <span id="add-drop-hint">Drop an image, or click to browse</span>
        </div>
        <input type="text" id="add-name-input" placeholder="Region name" />
        <p id="add-name-error" class="field-error hidden"></p>
        <div class="modal-buttons">
          <button type="button" class="btn-secondary" id="add-cancel-btn">Cancel</button>
          <button type="button" class="btn-primary" id="add-confirm-btn" disabled>Add</button>
        </div>
      </div>
    </div>

    <div id="opt-help-popover" class="hidden" role="tooltip"></div>
    <div id="nest-gap-overlay" class="hidden">
      <div id="nest-gap-panel" role="dialog" aria-label="Smart Packing gap">
        <p class="nest-gap-heading">Gap (px)</p>
        <div class="nest-gap-controls">
          <input type="range" id="nest-gap-slider" min="1" max="100" value="4" disabled />
          <input type="number" id="nest-gap-distance" class="nest-gap-input" min="1" max="256" value="4" disabled />
        </div>
        <div class="nest-gap-actions">
          <button type="button" class="btn-secondary" id="nest-gap-close">Close</button>
          <button type="button" class="btn-primary" id="nest-gap-confirm">Confirm</button>
        </div>
      </div>
    </div>

    <!-- Drop Overlay -->
    <div id="drop-overlay" class="hidden">
      <div class="drop-message">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
          <path d="M440-320v-326L336-542l-56-58 200-200 200 200-56 58-104-104v326h-80ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/>
        </svg>
        <span id="drop-message-text">Drop .atlas file here to load</span>
      </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="hidden">
      <div class="context-menu-item" onclick="copyPreviewImage()">
        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
          <path d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z"/>
        </svg>
        Copy Image
      </div>
      <div class="context-menu-item" onclick="savePreviewImageAs()">
        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
          <path d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/>
        </svg>
        Save Image As
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
